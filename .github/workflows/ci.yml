name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "${{ matrix.node }}" }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run smoke:pack --workspace @vanpana/things-ts-sdk
      - run: node --test "ops/*.test.mjs"
      - run: npm run do:mock --workspace things-ts-worker
  conformance:
    # Generates the Go SDK's answers with the pinned Go version and compares the TypeScript code with them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }
      - run: npm ci
      - run: npm run test:conformance
